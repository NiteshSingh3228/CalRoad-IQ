# ─────────────────────────────────────────────────────────────────
# CalRoad IQ — CI Pipeline
# Runs on every push and pull request to main.
#
# Rules:
#   - NO OpenRouter API calls
#   - NO GeoCLIP model downloads
#   - Must complete in < 5 minutes
# ─────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install core dependencies (no torch/geoclip) ─────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all deps except large ML packages (torch/geoclip)
          grep -v "^torch\|^torchvision\|^geoclip" requirements.txt > ci_requirements.txt
          pip install -r ci_requirements.txt
          pip install pytest

      # ── 4. Syntax check ──────────────────────────────────────────
      - name: Syntax check
        run: python -m py_compile Project.py && echo "Syntax OK"

      # ── 5. Lint ──────────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          pip install flake8 --quiet
          # E501=line-too-long (ignored for existing codebase)
          # W503=line-break-before-binary-operator (style opinion)
          flake8 Project.py \
            --max-line-length=120 \
            --ignore=E501,W503,E302,E303,E231,E225,E226,E228,E261 \
            --count --statistics || true

      # ── 6. Unit tests ─────────────────────────────────────────────
      - name: Run unit tests
        env:
          # Never set a real API key here
          OPENROUTER_API_KEY: ""
        run: |
          pytest tests/ -v --tb=short

      # ── 7. Security scan ─────────────────────────────────────────
      - name: Security scan (bandit)
        run: |
          pip install bandit --quiet
          bandit Project.py \
            --skip B101,B324 \
            -ll --quiet || true
          # B101 = assert statements (ok in test context)
          # B324 = hashlib (we use sha256, not md5 for security)

      # ── 8. Check for secrets ─────────────────────────────────────
      - name: Check for leaked secrets
        run: |
          if grep -rn "sk-or-v1-\|OPENROUTER_API_KEY\s*=\s*['\"][^'\"]\|Bearer sk-" \
               Project.py requirements.txt 2>/dev/null; then
            echo "::error::Possible leaked API key found in source code"
            exit 1
          fi
          echo "No secrets found in source code"
